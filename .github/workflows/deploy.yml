
name: ToAvansToGo CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore ToAvansToGo.sln

      - name: Build solution
        run: dotnet build ToAvansToGo.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test ToAvansToGo.sln --configuration ${{ env.CONFIGURATION }} --no-build
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Restore solution
        run: dotnet restore ToAvansToGo.sln

      - name: Create migration bundles
        run: |
          dotnet ef migrations bundle \
            --project src/ToAvansToGo.Infrastructure/ToAvansToGo.Infrastructure.csproj \
            --startup-project src/ToAvansToGo.Web/ToAvansToGo.Web.csproj \
            --context ApplicationDbContext \
            --configuration ${{ env.CONFIGURATION }} \
            --output ./efbundle-app
          dotnet ef migrations bundle \
            --project src/ToAvansToGo.Infrastructure/ToAvansToGo.Infrastructure.csproj \
            --startup-project src/ToAvansToGo.Web/ToAvansToGo.Web.csproj \
            --context ToAvansToGoIdentityDbContext \
            --configuration ${{ env.CONFIGURATION }} \
            --output ./efbundle-identity

      - name: Apply migrations
        run: |
          ./efbundle-app --connection "${{ secrets.APP_DB_CONNECTION }}"
          ./efbundle-identity --connection "${{ secrets.IDENTITY_DB_CONNECTION }}"

      - name: Publish MVC application
        run: >
          dotnet publish src/ToAvansToGo.Web/ToAvansToGo.Web.csproj
          --configuration Release
          --framework net8.0
          --no-restore
          --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ToAvansToGo8
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
